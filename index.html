<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>ورّيني · واقع معزز</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://3d-scanner-ar.higgsfield.app" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Tajawal,system-ui,Tahoma,Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
  #cv{position:fixed;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
  #ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto auto;padding:18px 14px 10px;pointer-events:none}
  #hint{margin:0;justify-self:center;max-width:92%;background:rgba(15,27,45,.74);border-radius:14px;padding:10px 16px;font-weight:800;font-size:16px;text-align:center;transition:opacity .4s}
  #hint.off{opacity:0}
  #bar{grid-row:3;display:flex;justify-content:center;padding-bottom:12px;pointer-events:auto}
  #bar button{background:rgba(255,255,255,.95);color:#0F1B2D;border:0;border-radius:14px;padding:12px 18px;font:800 15px Tajawal,system-ui,Arial;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #credit{grid-row:4;justify-self:center;font:600 9px/1.2 system-ui,Arial;color:rgba(255,255,255,.7);text-decoration:none;pointer-events:auto;text-align:center}
  #err{position:fixed;left:50%;top:18px;transform:translateX(-50%);width:min(92%,420px);background:#fff;color:#0F1B2D;border-radius:16px;padding:14px 16px;text-align:center;font-weight:700;box-sizing:border-box}
  #err p{margin:0 0 10px}
  #err a{display:inline-block;background:#2D5BFF;color:#fff;border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:900}
  #ios{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:18px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 35%,#fff,#DCE5EE);color:#0F1B2D}
  #ios a img{display:block;max-width:78vw;max-height:56vh;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(15,27,45,.25))}
  #ios button{border:0;background:#2D5BFF;color:#fff;border-radius:18px;padding:16px 24px;font:800 19px Tajawal,-apple-system,system-ui,Arial}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <p id="hint">⏳ لحظة، راهي تتحل الكاميرا…</p>
  <div id="bar"><button id="again" type="button" hidden>↻ جيبو قدامي</button></div>
  <a id="credit" href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noreferrer">AR: 8th Wall Engine © 2026 Niantic Spatial, Inc. · XR Engine License · provided “as is”</a>
</div>
<div id="err" hidden><p>ما قدرناش نحلّو الكاميرا هنا. تأكد بلي سمحت للكاميرا، ولا جرّب الطريقة الأخرى.</p><a id="alt" href="#">📱 جرّب الطريقة الأخرى</a></div>
<div id="ios" hidden><a id="ar" rel="ar" href="#"><img id="arimg" alt=""></a><button id="arbtn" type="button">📱 المس باش يطلع قدامك</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"}}</script>
<script type="module">
const API = "https://3d-scanner-ar.higgsfield.app";
const ENGINE = "https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js";
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.187.0";
const CAMERA_HEIGHT = 0.45; // metres between a seated customer's phone and the table: sets the scale of the scene
const MIN_DIST = 0.3, MAX_DIST = 1.2;

const q = new URLSearchParams(location.search);
const slug = (q.get("m") || "").toLowerCase();
const ver = (q.get("v") || "1").replace(/[^0-9]/g, "") || "1";
const $ = (id) => document.getElementById(id);
const report = (event, info = "") => { try { navigator.sendBeacon(`${API}/api/diag`, new Blob([JSON.stringify({ event, info: `${slug} ${info}`.trim() })], { type: "text/plain" })); } catch {} };
const fail = (info) => { $("hint").hidden = true; $("err").hidden = false; $("alt").href = `${API}/a/${slug}`; report("x", `error ${String(info).slice(0, 160)}`); };

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

if (!/^[a-z0-9]{4,16}$/.test(slug)) {
  location.replace(API);
} else if (isIOS) {
  // AR Quick Look in AR mode: a rel="ar" link holding only an <img>, clicked by the page itself.
  $("ui").hidden = true; $("cv").hidden = true; $("ios").hidden = false;
  const a = $("ar");
  a.href = `${API}/f/${slug}.usdz?v=${ver}#allowsContentScaling=0`;
  $("arimg").src = `${API}/f/${slug}.jpg?v=${ver}`;
  $("arbtn").onclick = () => a.click();
  report("x", "ios");
  try { a.click(); } catch {}
} else {
  startWorld().catch((e) => fail(e && e.message ? e.message : e));
}

function loadEngine() {
  if (window.XR8) return Promise.resolve(window.XR8);
  return new Promise((resolve, reject) => {
    window.addEventListener("xrloaded", () => resolve(window.XR8), { once: true });
    const s = document.createElement("script");
    s.src = ENGINE; s.async = true; s.crossOrigin = "anonymous";
    s.setAttribute("data-preload-chunks", "slam");
    s.onerror = () => reject(new Error("engine-load"));
    document.head.appendChild(s);
  });
}

async function parseGlb(THREE, renderer, buf) {
  const [{ GLTFLoader }, { DRACOLoader }, { KTX2Loader }, { MeshoptDecoder }] = await Promise.all([
    import(`${THREE_URL}/examples/jsm/loaders/GLTFLoader.js`),
    import(`${THREE_URL}/examples/jsm/loaders/DRACOLoader.js`),
    import(`${THREE_URL}/examples/jsm/loaders/KTX2Loader.js`),
    import(`${THREE_URL}/examples/jsm/libs/meshopt_decoder.module.js`),
  ]);
  const loader = new GLTFLoader();
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
  loader.setDRACOLoader(draco);
  loader.setMeshoptDecoder(MeshoptDecoder);
  loader.setKTX2Loader(new KTX2Loader().setTranscoderPath(`${THREE_URL}/examples/jsm/libs/basis/`).detectSupport(renderer));
  return loader.parseAsync(buf, "");
}

function blobShadow(THREE, w, d) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(0,0,0,0.5)"); gr.addColorStop(0.55, "rgba(0,0,0,0.22)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  mesh.position.y = 0.002; mesh.renderOrder = -1;
  return mesh;
}

function sharpen(root, anisotropy) {
  root.traverse((o) => {
    if (!o.material) return;
    for (const mat of Array.isArray(o.material) ? o.material : [o.material]) {
      for (const k of ["map", "emissiveMap", "normalMap", "roughnessMap", "metalnessMap", "aoMap"]) {
        const t = mat[k]; if (t && t.anisotropy !== anisotropy) { t.anisotropy = anisotropy; t.needsUpdate = true; }
      }
    }
  });
}

async function startWorld() {
  report("x", "open");
  const hint = $("hint");
  const glb = fetch(`${API}/f/${slug}.glb?v=${ver}`).then((r) => { if (!r.ok) throw new Error(`glb ${r.status}`); return r.arrayBuffer(); });
  const [THREE, XR8] = await Promise.all([import(`${THREE_URL}/build/three.module.js`), loadEngine()]);
  window.THREE = { ...THREE }; // the engine reads three.js from window.THREE
  if (!XR8.XrController) await XR8.loadChunk("slam");

  const canvas = $("cv");
  const sizeCanvas = () => { const dpr = Math.min(window.devicePixelRatio || 1, 2.5); canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr); };
  sizeCanvas(); addEventListener("resize", sizeCanvas);

  let ctx = null, model = null, mixer = null, placed = false, normalSince = 0, lastTime = 0;
  const holder = new THREE.Group(); holder.visible = false;
  const pos = new THREE.Vector3(), dir = new THREE.Vector3();

  const place = () => {
    const { camera } = ctx;
    camera.getWorldPosition(pos); camera.getWorldDirection(dir);
    let dx, dz;
    if (dir.y < -0.12) { const t = -pos.y / dir.y; dx = dir.x * t; dz = dir.z * t; } else { dx = dir.x; dz = dir.z; }
    let d = Math.hypot(dx, dz); if (d < 1e-3) { dx = 0; dz = -1; d = 1; }
    const k = Math.min(MAX_DIST, Math.max(MIN_DIST, d)) / d;
    holder.position.set(pos.x + dx * k, 0, pos.z + dz * k);
    holder.rotation.set(0, Math.atan2(pos.x - holder.position.x, pos.z - holder.position.z), 0);
    holder.visible = true;
    if (!placed) report("x", "placed");
    placed = true;
    hint.textContent = "✓ راهو فوق الطاولة، دور عليه كيما تحب"; hint.classList.remove("off");
    setTimeout(() => hint.classList.add("off"), 3000);
    $("again").hidden = false;
  };
  $("again").onclick = () => { if (model) place(); };

  XR8.XrController.configure({ disableWorldTracking: false, scale: "responsive" });
  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(),
    XR8.Threejs.pipelineModule(),
    XR8.XrController.pipelineModule(),
    {
      name: "warini-world",
      onStart: () => {
        const s = XR8.Threejs.xrScene();
        ctx = { scene: s.scene, camera: s.camera, renderer: s.renderer };
        import(`${THREE_URL}/examples/jsm/environments/RoomEnvironment.js`).then(({ RoomEnvironment }) => {
          const pmrem = new THREE.PMREMGenerator(ctx.renderer);
          ctx.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
          ctx.scene.environmentIntensity = 0.9;
        }).catch(() => {});
        ctx.scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f73, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(0.6, 2, 1.2); ctx.scene.add(sun);
        ctx.scene.add(holder);
        ctx.camera.position.set(0, CAMERA_HEIGHT, 0);
        XR8.XrController.updateCameraProjectionMatrix({ origin: ctx.camera.position, facing: ctx.camera.quaternion });
        hint.textContent = "👀 وجّه الكاميرا للطاولة وحرّك التلفون بشوية";
        report("x", "camera");
      },
      onUpdate: () => {
        const now = performance.now();
        if (!placed && model && normalSince && now - normalSince > 800) place();
        if (mixer) mixer.update(lastTime ? Math.min((now - lastTime) / 1000, 0.1) : 0);
        lastTime = now;
      },
      onCameraStatusChange: ({ status, reason }) => {
        if (status === "requesting") hint.textContent = "📷 اسمح للكاميرا باش يطلع قدامك";
        else if (status === "failed") fail(`camera ${reason || ""}`);
      },
      onException: (e) => { let s; try { s = e instanceof Error ? e.message : JSON.stringify(e); } catch { s = String(e); } fail(s); },
      listeners: [{ event: "reality.trackingstatus", process: ({ detail }) => {
        if (detail && detail.status === "NORMAL") { if (!normalSince) normalSince = performance.now(); }
        else if (!placed) normalSince = 0;
      } }],
    },
  ]);
  XR8.run({ canvas, webgl2: true, allowedDevices: XR8.XrConfig.device().ANY });

  const buf = await glb;
  while (!ctx) await new Promise((r) => setTimeout(r, 50));
  const gltf = await parseGlb(THREE, ctx.renderer, buf);
  const m = gltf.scene;
  sharpen(m, ctx.renderer.capabilities.getMaxAnisotropy());
  const box = new THREE.Box3().setFromObject(m);
  if (!box.isEmpty()) {
    const c = box.getCenter(new THREE.Vector3());
    m.position.x -= c.x; m.position.z -= c.z; m.position.y -= box.min.y;
    const size = box.getSize(new THREE.Vector3());
    holder.add(blobShadow(THREE, Math.max(size.x, 0.05) * 1.3, Math.max(size.z, 0.05) * 1.3));
  }
  holder.add(m);
  if (gltf.animations && gltf.animations.length) { mixer = new THREE.AnimationMixer(m); for (const clip of gltf.animations) mixer.clipAction(clip).play(); }
  model = m;
}
</script>
</body>
</html>
